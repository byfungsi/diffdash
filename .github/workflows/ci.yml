name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "22.20.0"
  PNPM_VERSION: "10.26.1"
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  verify:
    name: Format, affected packages, and integration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install browser and Electron system dependencies
        run: pnpm --filter @diffdash/e2e exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Check generated output drift
        run: pnpm generated:check

      - name: Lint, typecheck, unit test, and build affected packages
        run: pnpm ci:affected

      - name: Run architecture and bundle boundaries
        run: pnpm test:boundaries

      - name: Run browser tests
        run: |
          pnpm --filter @diffdash/app exec vitest --config vitest.browser.config.ts run src/review/review-virtualization.browser.test.tsx -t "keeps continuous fast scrolling within the review rendering budget"
          pnpm --filter @diffdash/app exec vitest --config vitest.browser.config.ts run src/review/review-virtualization.browser.test.tsx -t "removes stale trailing buffers after navigating across many wrapped files"
          pnpm --filter @diffdash/app exec vitest --config vitest.browser.config.ts run src/review/review-virtualization.browser.test.tsx -t "navigates to exact matches in virtualized lines"
          pnpm --filter @diffdash/app exec vitest --config vitest.browser.config.ts run src/review/review-virtualization.browser.test.tsx -t "converges on distant matches after wrapped lines change virtual heights"
          pnpm --filter @diffdash/app exec vitest --config vitest.browser.config.ts run src/home/home.browser.test.tsx
          pnpm --filter @diffdash/app exec vitest --config vitest.browser.config.ts run src/review/review.browser.test.tsx
          pnpm --filter @diffdash/app exec vitest --config vitest.browser.config.ts run --exclude src/review/review-virtualization.browser.test.tsx --exclude src/home/home.browser.test.tsx --exclude src/review/review.browser.test.tsx

      - name: Run download worker checks
        run: pnpm --filter @diffdash/download-worker check && pnpm --filter @diffdash/download-worker test

      - name: Run Electron E2E tests
        env:
          DEBUG: pw:browser
        run: xvfb-run -a pnpm test:e2e

      - name: Run forced external Core host diagnostics
        env:
          DEBUG: pw:browser
        run: xvfb-run -a node packages/e2e/scripts/run-forced-core-host-e2e.mjs

      - name: Run packaged Electron E2E tests
        env:
          DEBUG: pw:browser
        run: xvfb-run -a pnpm test:e2e:packaged

      - name: Detect provider or protocol changes
        id: integration
        shell: bash
        run: |
          if git diff --quiet "${TURBO_SCM_BASE}" "${TURBO_SCM_HEAD}" -- \
            packages/protocol \
            packages/agent-provider \
            packages/agent-provider-* \
            packages/git-provider \
            packages/git-provider-*; then
            printf '%s\n' 'required=false' >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' 'required=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Run dependent provider and protocol integration
        if: steps.integration.outputs.required == 'true'
        run: xvfb-run -a pnpm ci:integration

      - name: Upload failed integration evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-linux-failure-evidence
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
            packages/desktop/test-results
            tools/repository-scale/.cache/reports
          if-no-files-found: ignore
          retention-days: 7

  packaged-macos:
    name: Packaged Core hosts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Verify runner architecture
        run: node -e 'if (process.arch !== process.argv[1]) throw new Error(`Expected ${process.argv[1]}, got ${process.arch}`)' "${{ matrix.arch }}"

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run packaged Bun and utility flows
        run: pnpm test:e2e:packaged

      - name: Upload failed packaged evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-macos-${{ matrix.arch }}-failure-evidence
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
            packages/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7
