name: Repository Scale Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "22.20.0"
  PNPM_VERSION: "10.26.1"

jobs:
  packaged-scale:
    name: Ubuntu x64 ${{ matrix.host }} Core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host:
          - bun
          - utility
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron and Chromium system dependencies
        run: pnpm --filter @diffdash/e2e exec playwright install --with-deps chromium

      - name: Generate pinned full fixture
        run: pnpm repository-scale:generate

      - name: Run packaged repository-scale gates
        run: >-
          xvfb-run -a pnpm --filter @diffdash/repository-scale run --
          --host=${{ matrix.host }}
          --session=ubuntu-x64-${{ matrix.host }}-${{ github.run_id }}

      - name: Upload path-free summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-scale-${{ matrix.host }}-summary
          path: tools/repository-scale/.cache/orchestration/*/summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload private raw evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-scale-${{ matrix.host }}-failure-evidence
          path: |
            tools/repository-scale/.cache/orchestration/*/raw.json
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
